name: Sync TorrentNG package and bundles

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Sync package files and latest release bundles
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/sync_upstream.py
      - name: Commit synchronized package
        run: |
          if git diff --quiet; then
            echo 'YunoHost package and bundle references are current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m "chore: sync TorrentNG package and release bundles"
          git push
